<!DOCTYPE html>
<html>

<head>
    <title>Socket.IO Chat Test</title>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
        }

        #messages {
            height: 300px;
            border: 1px solid #ccc;
            overflow-y: scroll;
            padding: 10px;
            margin-bottom: 10px;
        }

        #messageForm {
            display: flex;
            margin-bottom: 10px;
        }

        #content {
            flex: 1;
            padding: 8px;
        }

        button {
            padding: 8px 15px;
            background: #007bff;
            color: white;
            border: none;
            cursor: pointer;
        }

        .message {
            margin-bottom: 8px;
        }

        .info {
            color: #666;
            font-style: italic;
        }
    </style>
</head>

<body>
    <h1>Chat Test</h1>
    <button onclick="loadHistory()">Load History</button>
    <div>
        <label for="roomId">Room ID:</label>
        <input type="text" id="roomId" value="general" />
        <button onclick="joinRoom()">Join Room</button>
    </div>

    <div id="messages"></div>

    <form id="messageForm" onsubmit="sendMessage(event)">
        <input type="text" id="content" placeholder="Type your message..." required />
        <button type="submit">Send</button>
    </form>

    <script>
        // 替换为你的有效JWT令牌（可以从/login接口获取）
        const token = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJhY2NvdW50IjoiYWNjb3VudHMiLCJpZCI6MywiaWF0IjoxNzQ2NzAzNDEzLCJleHAiOjE3NDY3ODk4MTN9.SvkSF1ViQNjQuMCJqNVtABFudmSfwH5hk_Mq5jQh4rI";

        // 初始化Socket.IO连接
        const socket = io("http://localhost:3000", {
            path: "/chat/socket.io",
            auth: { token }
        });

        // DOM元素
        const messagesDiv = document.getElementById('messages');
        const roomIdInput = document.getElementById('roomId');
        const contentInput = document.getElementById('content');

        // 连接事件处理
        socket.on("connect", () => {
            logMessage(`Connected to server as ${socket.id}`);
        });

        socket.on("error", (err) => {
            logMessage(`Error: ${err.message}`, true);
        });

        // 加入房间
        function joinRoom() {
            const roomId = roomIdInput.value.trim();
            if (roomId) {
                socket.emit("join_room", roomId);
                logMessage(`Joining room: ${roomId}`);
            }
        }

        // 发送消息
        function sendMessage(event) {
            event.preventDefault();
            const roomId = roomIdInput.value.trim();
            const content = contentInput.value.trim();

            if (roomId && content) {
                socket.emit("send_message", { roomId, content });
                contentInput.value = '';
            }
        }

        // 接收消息
        socket.on("receive_message", (data) => {
            logMessage(`${data.account}: ${data.content}`);
        });

        // 用户加入通知
        socket.on("user_joined", (data) => {
            logMessage(`${data.account} joined the room`, false, true);
        });

        // 错误处理
        socket.on("chat_error", (error) => {
            logMessage(`Error: ${error}`, true);
        });

        // 辅助函数：在消息框中显示消息
        function logMessage(message, isError = false, isInfo = false) {
            const messageElement = document.createElement('div');
            messageElement.className = isError ? 'message error' :
                isInfo ? 'message info' : 'message';
            messageElement.textContent = message;
            messagesDiv.appendChild(messageElement);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }

        async function loadHistory() {
                const roomId = document.getElementById('roomId').value.trim();
                const response = await fetch(`http://localhost:3000/messages/${roomId}`);
                const data = await response.json();

                if (data.success) {
                    data.data.forEach(msg => {
                        logMessage(`${msg.account} (历史): ${msg.content}`);
                    });
                } else {
                    logMessage(`Failed to load history: ${data.message}`, true);
                }
            }
    </script>
</body>

</html>
